<script type="text/javascript">
(function () {
  var root = document.documentElement;
  root.className += " kv-html-theme";
  function applyView() {
    var mobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
    if (mobile) {
      root.className += " kv-view-mobile";
    } else {
      root.className = root.className.replace(/\bkv-view-mobile\b/g, "");
    }
  }
  function markInnerPage() {
    if (!document.body) return;
    var path = (location.pathname || "").toLowerCase();
    var isHome =
      path === "/" ||
      path === "/default.aspx" ||
      path.indexOf("/home.aspx") >= 0;
    if (!isHome) {
      document.body.className += " kv-page-inner";
    }
    if (path.indexOf("/teams/teamdetails") >= 0) {
      document.body.className += " kv-page-team";
    }
    if (path.indexOf("userdetails") >= 0) {
      document.body.className += " kv-page-user";
    }
    if (path.indexOf("userbalance") >= 0) {
      document.body.className += " kv-page-balance";
    }
    if (path.indexOf("enmail") >= 0) {
      document.body.className += " kv-page-mail";
    }
    if (path.indexOf("guestbook.aspx") >= 0) {
      document.body.className += " kv-page-guestbook";
    }
    if (path.indexOf("/guestbook/messages") >= 0) {
      document.body.className += " kv-page-gb-topic";
    }
  }

  function onReady() {
    if (document.body) {
      document.body.className += " kv-full-theme";
      markInnerPage();
    }
    applyView();
  }
  applyView();
  if (window.matchMedia) {
    var mq = window.matchMedia("(max-width: 768px)");
    if (mq.addListener) mq.addListener(applyView);
    else if (mq.addEventListener) mq.addEventListener("change", applyView);
  }
  if (document.body) onReady();
  else document.addEventListener("DOMContentLoaded", onReady);
})();
</script>

<script type="text/javascript">
jQuery(function ($) {
  $("#tdLogo").hide();
  $("body").addClass("kv-full-theme");
  $("html").addClass("kv-html-theme");
  (function () {
    var path = (location.pathname || "").toLowerCase();
    var isHome =
      path === "/" ||
      path === "/default.aspx" ||
      path.indexOf("/home.aspx") >= 0;
    if (!isHome) {
      $("body").addClass("kv-page-inner");
    }
    if (path.indexOf("/teams/teamdetails") >= 0) {
      $("body").addClass("kv-page-team");
    }
    if (path.indexOf("userdetails") >= 0) {
      $("body").addClass("kv-page-user");
    }
    if (path.indexOf("userbalance") >= 0) {
      $("body").addClass("kv-page-balance");
    }
    if (path.indexOf("enmail") >= 0) {
      $("body").addClass("kv-page-mail");
    }
  })();

  function initKvStars() {
    var src = $("img[src*=en_logo]:eq(0)").attr("src");
    if (!src) {
      return;
    }
    var m = src.match(/en_logo(\d+)/);
    if (!m) {
      return;
    }
    var w = parseInt(m[1], 10) * 20;
    var $divs = $("#dnk_head .star div");
    if (!$divs.length) {
      return;
    }
    $divs.stop(true).css("width", 0);
    $divs.animate({ width: w + "px" }, 1250);
  }

  function markGameInfoRows() {
    var $gi = $("#tdContentCenter table.gameInfo").first();
    if (!$gi.length) {
      return;
    }
    $gi.find("> tbody > tr").each(function () {
      var $tr = $(this);
      var $td = $tr.children("td").first();
      if (!$td.length) {
        return;
      }
      $tr.removeClass(
        "kv-game-row-end kv-game-row-timer kv-game-row-fee kv-game-row-prize"
      );
      if ($td.find('a[href*="MakeGameFee.aspx"]').length) {
        $tr.addClass("kv-game-row-fee");
        return;
      }
      if ($td.find("#GameDetail_lblPrizeCurrency").length) {
        $tr.addClass("kv-game-row-prize");
        return;
      }
      if ($td.find('[id^="TimerText"]').length) {
        $tr.addClass("kv-game-row-timer");
        return;
      }
      var titleText = ($td.find(".title").first().text() || "").toLowerCase();
      if (titleText.indexOf("окончан") >= 0) {
        $tr.addClass("kv-game-row-end");
      }
    });
  }

  function layoutGameFeeRow() {
    $("#tdContentCenter table.gameInfo > tbody > tr.kv-game-row-fee > td").each(
      function () {
        var $td = $(this);
        if ($td.children(".kv-fee-row").length) {
          return;
        }
        var $wrap = $('<div class="kv-fee-row"></div>');
        $td.contents().appendTo($wrap);
        $td.append($wrap);
      }
    );
  }

  function setupConfirmFeeButtons() {
    $('a[href*="MakeGameFee.aspx"]').each(function () {
      var $a = $(this);
      $a.addClass("kv-btn-confirm-fee");
      if (!$a.attr("title")) {
        $a.attr("title", "подтвердить участие");
      }
    });
    markGameInfoRows();
    layoutGameFeeRow();
  }

  function setupGuestLoginBox() {
    var $box = $("#boxUser");
    if (!$box.length) {
      return;
    }
    var $login = $box.find('a[href*="/Login.aspx"]').filter(function () {
      return String($(this).attr("href") || "").indexOf("logout") === -1;
    }).first();
    if (!$login.length) {
      $box.removeClass("kv-box-guest");
      return;
    }
    $box.addClass("kv-box-guest");
    $login.closest("table").addClass("kv-guest-login-table");
  }

  /* DOM: .kv-head-brand > .star + .logo (звёзды в разметке перед лого, в CSS — overlay на лого).
     Позицию лого/бургера не менять; звёзды только absolute внутри .kv-head-brand. */
  function setupMobileHeader() {
    var mobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
    var $head = $("#dnk_head");
    if (!$head.length) {
      return;
    }

    var $burger = $("#kvMenuFallback");
    if (!$burger.length) {
      $burger = $head.find(".menu-wrap").first();
    }
    if (!$burger.length) {
      $burger = $head.next(".menu-wrap");
    }
    if (!$burger.length) {
      $burger = $("#DivTopDesign .menu-wrap").first();
    }

    if ($burger.length && !$burger.attr("id")) {
      $burger.attr("id", "kvMenuFallback");
    }

    var $bar = $head.find(".kv-head-bar");
    if (!$bar.length) {
      $bar = $('<div class="kv-head-bar"></div>');
      $head.append($bar);
    }
    $bar = $head.find(".kv-head-bar");

    var $left = $bar.find(".kv-head-left");
    if (!$left.length) {
      $left = $('<div class="kv-head-left"></div>');
      $bar.prepend($left);
    }

    var $brand = $left.find(".kv-head-brand").first();
    if (!$brand.length) {
      $brand = $(document.createElement("div")).addClass("kv-head-brand");
      $left.append($brand);
    }

    var $star = $head.find(".star").first();
    var $logo = $head.find(".logo").first();
    if ($logo.length && !$logo.closest(".kv-head-brand").length) {
      $logo.appendTo($brand);
    }
    if ($star.length && !$star.closest(".kv-head-brand").length) {
      $star.prependTo($brand);
    }
    $star = $brand.find(".star").first();
    $logo = $brand.find(".logo").first();
    /* Звёзды строго над логотипом */
    if ($star.length && $logo.length && $star.index() > $logo.index()) {
      $star.insertBefore($logo);
    }

    $left.find(".star .front, .star .clear").each(function () {
      if (!$(this).attr("style") || $(this).attr("style").indexOf("width") < 0) {
        $(this).css("width", 0);
      }
    });

    if (mobile && $burger.length) {
      if (!$burger.closest("#dnk_head").length) {
        $burger.appendTo($bar);
      }
      if (!$burger.find(".kv-burger-btn").length) {
        $burger.find(".hamburger").hide();
        if (!$burger.find(".toggler").length) {
          $burger.prepend('<input class="toggler" type="checkbox" id="kvMenuToggler" />');
        }
        $burger.find(".toggler").first().after(
          '<label class="kv-burger-btn" for="kvMenuToggler" aria-label="Открыть меню"></label>'
        );
      }
      if (!$burger.find(".toggler").length) {
        $burger.prepend('<input class="toggler" type="checkbox" id="kvMenuToggler" />');
      } else {
        $burger.find(".toggler").attr("id", "kvMenuToggler");
      }
      $burger.find(".kv-burger-btn").attr("for", "kvMenuToggler");
      $burger.css({ display: "block", visibility: "visible", opacity: 1 });
      $head.next(".menu-wrap").not($burger).hide();
    }
  }

  setupConfirmFeeButtons();
  setupGuestLoginBox();
  setupMobileHeader();
  initKvStars();
  setTimeout(function () {
    setupConfirmFeeButtons();
    setupGuestLoginBox();
    setupMobileHeader();
    initKvStars();
  }, 200);
  setTimeout(function () {
    setupConfirmFeeButtons();
    setupGuestLoginBox();
    setupMobileHeader();
    initKvStars();
  }, 900);
  $(window).bind("resize.kvhead load.kvhead", function () {
    setupConfirmFeeButtons();
    setupGuestLoginBox();
    setupMobileHeader();
    initKvStars();
  });

  function centerDomainMenu() {
    if (window.matchMedia && window.matchMedia("(max-width: 768px)").matches) {
      return;
    }
    var $menu = $(".menuWrap ul.menu");
    if (!$menu.length) {
      return;
    }
    $menu.css({
      cssFloat: "none",
      marginLeft: "auto",
      marginRight: "auto",
      display: "inline-table"
    });
    $(".menuWrap td[align='center']").css("textAlign", "center");
  }

  centerDomainMenu();
  setTimeout(centerDomainMenu, 400);
  setTimeout(centerDomainMenu, 1500);
  $(window).bind("load.kvmenu", centerDomainMenu);
});
</script>
