<script type="text/javascript">// <![CDATA[
  // Календарь игр v.1.2
  // by Dmitry Timoshenko / Flashman
  // Created: 21 Feb 2017

  var timeLeftSpanIDs = [];

  $(function () {
    $div = $("div#divCalendar");
    if ($div.length == 0) {
      console.error('#divCalendar not found');
    }
    $($div).append("<table cellspacing=\"1\" class=\"tblcalendar bg_light2 w100per\" id=\"tblcalendar\"><tbody></tbody></table>");
    $tbody = $("table#tblcalendar tbody");
    $tbody.append(`
    <tr class="topWinnerHead">
      <td></td>
      <td class="topWinners">Название игры</td>
      <td class="topWinners">Автор(ы)</td>
      <td class="topWinners">Начало игры</td>
      <td class="topWinners">Осталось</td>
    </tr>
    `);
    var numGames = $("table.gameInfo").length;
    if (numGames > 0) {
        let gamesLeft = false;
      $("table.gameInfo").each(function(index) {
          if (index > 7)  {
              gamesLeft = true;
              return;
          }
        $gameTitleLink = $(this).find("a#lnkGameTitle");
        $gameTitleLinkHref = $gameTitleLink.prop("href");
        $gameTitle = $gameTitleLink.text();
        const quotesNumber = [...$gameTitle.matchAll(/"/g)].length;
        $gameTitle = quotesNumber % 2 ? $gameTitle + '"' : $gameTitle;
        $trGameHeader = $gameTitleLink.closest("tr");
        $gameTypeImg = $trGameHeader.children("td").first().html();
        $gameType = $trGameHeader.children("td").eq(1).first().text();
        $topicLinkHref = $(this).find("a#lnkGbTopic").prop("href");
        $mainTRs = $trGameHeader.closest("table").closest("tbody").children("tr");
        $teamType = $mainTRs.eq(1).first().children("td").first().children("span").eq(1).first().text();
        $timeLeftSpan = $(this).find("span:contains('Времени осталось:')").next().children("span").first();
        $timeLeftText = "игра уже началась";
        if ($timeLeftSpan.length) {
          $timeLeftSpanID = $timeLeftSpan.prop("id");
          $timeLeftText = "<span id=\"" + $timeLeftSpanID + "-replica\">" + GetShortTimeLeft($timeLeftSpan.text()) + "</span>";
          timeLeftSpanIDs.push($timeLeftSpanID);
        }
        $gameStartDateTime = $(this).find("span:contains('Начало игры:')").next().text().split("(")[0].trim();
        
        const authors =$(this).find('#lnkAuthor').toArray().map(x=>x.outerHTML).join(' ');

        $tbody.append(`
        <tr class=${index % 2 == 0 ? 'toWinnerAltItem' : 'toWinnerItem'}>
          <td>${$gameTypeImg}</td>
          <td><a href="${$gameTitleLinkHref}"><b>${$gameTitle}</b></a></td>
          <td>${authors}</td>
          <td>${$gameStartDateTime}</td>
          <td>${$timeLeftText}</td>
        </tr>
        `);

      });
      
      if (gamesLeft) {
          $tbody.append(`
        <tr class=${(numGames+1) % 2 == 0 ? 'toWinnerAltItem' : 'toWinnerItem'}>
          <td colspan=5 style="padding: 10px;"><span>и другие...</span></td>
        </tr>
        `);
      }

      setInterval(function () {
        $(timeLeftSpanIDs).each(function () {
          $newTimeLeft = GetShortTimeLeft($("span#" + this).text());
          $("span#" + this + "-replica").html($newTimeLeft);
        });
      }, 1000);
    }
    else {
      $tbody.append("<tr class=\"toWinnerItem\"><td colspan=\"4\" class=\"pad5\">Нет запланированных игр</td></tr>");
    }
  });

  function GetShortTimeLeft(value) {
    return value
      .split(' ')
      .filter((x, i) => i < 4)
      .join(' ')
      .replace(/(.+)\s0 часов$/, '$1')
      .trim();
  }
// ]]></script>
